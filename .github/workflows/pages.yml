name: Deploy production site to GitHub Pages

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COVE_SITE_ENV: production
      COVE_PADDLE_CLIENT_TOKEN: ${{ vars.COVE_PADDLE_CLIENT_TOKEN }}
      COVE_MONTHLY_PRICE_ID: ${{ vars.COVE_MONTHLY_PRICE_ID }}
      COVE_ANNUAL_PRICE_ID: ${{ vars.COVE_ANNUAL_PRICE_ID }}
      COVE_PADDLE_PRODUCT_ID: ${{ vars.COVE_PADDLE_PRODUCT_ID }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
